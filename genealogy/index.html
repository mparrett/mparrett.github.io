<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Parrett Family History</title>
  <meta name="author" content="Matthew M. Parrett">
  <style>
    :root {
      --primary: #7a3a0f;
      --text: #2d3748;
      --muted: #6b6257;
      --background: #faf9f7;
      --card: #fffdf9;
      --border: #e8e5e0;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #d9a877;
        --text: #e4d9c6;
        --muted: #9b8d78;
        --background: #1d1915;
        --card: #26211b;
        --border: #3b3128;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      line-height: 1.6;
      color: var(--text);
      background: var(--background);
    }

    main {
      max-width: 32rem;
      width: 100%;
      padding: 2.5rem 2rem;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: normal;
      font-size: 2rem;
      line-height: 1.2;
      color: var(--primary);
      margin-bottom: 1rem;
    }

    p { margin-bottom: 1.5rem; }

    .button {
      display: inline-block;
      padding: 0.65rem 1.4rem;
      font-weight: 600;
      color: var(--background);
      background: var(--primary);
      border-radius: 6px;
      text-decoration: none;
    }
    .button:hover { opacity: 0.9; }
    .button:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }

    .note {
      margin: 1.5rem 0 0;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Parrett Family History</h1>
    <p>Biographies and research across the family lines, with sources.</p>
    <a class="button" href="https://genealogy.parrett.us/">Visit the family site</a>
    <p class="note">The site is private to family. You'll be asked for your email address and sent a one-time sign-in code.<br>By Matthew M. Parrett</p>
  </main>
</body>
</html>
